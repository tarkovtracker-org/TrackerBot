name: Annual license year update

on:
  schedule:
    - cron: "0 0 1 1 *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-license-year:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update the year in LICENSE
        run: |
          year="$(date +%Y)"
          # Matches "Copyright (c) 2025" or "Copyright (c) 2025-2026" and replaces
          # the year portion with the current year.
          sed -i -E "s/Copyright \(c\) [0-9]{4}(-[0-9]{4})? /Copyright (c) ${year} /" LICENSE

      - name: Commit and push if changed
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LICENSE
          git commit -m "chore: update license year"
          git push
