<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TarkovTracker – Dev/Nuxt Bug Report</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="page">
      <section class="card">
        <span class="pill">Dev/Nuxt Bug Report</span>
        <h1>Help us fix dev.TarkovTracker.org, the new version of TarkovTracker.</h1>
        <p>
          Help us to maintain this repo: <code>TarkovTracker-org/TarkovTrackerNuxt</code>.
        </p>

        <form id="devBugForm">
          <label for="title">Title *</label>
          <input type="text" name="title" id="title" placeholder="What went wrong?" required />

          <label for="discord">Discord handle *</label>
          <input type="text" name="discord" id="discord" placeholder="Example#1234" required />

          <label for="description">Description *</label>
          <textarea name="description" id="description" placeholder="Steps to reproduce, expected result, assets, etc." required></textarea>

          <div class="actions">
            <button type="submit">Submit bug report</button>
          </div>
        </form>

        <div id="dataStatus" class="status"></div>
      </section>

      <section class="card stack">
        <p><strong>Need to report an app or UI bug?</strong></p>
        <p>Return to the <a href="/" style="color:#ffa26b;">main bug form</a> to create a classic Tracker.org issue.</p>
      </section>
    </main>

<script>
  const form = document.getElementById("dataBugForm");
  const statusBox = document.getElementById("dataStatus");

  function showStatus(message, isError = false) {
    statusBox.textContent = message;
    statusBox.className = isError ? "status error" : "status success";
  }

  form.addEventListener("submit", async event => {
    event.preventDefault();
    showStatus("Submitting data bug report...");

    const payload = Object.fromEntries(new FormData(form).entries());

    try {
      const res = await fetch("/submit-data-bug", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      if (!res.ok) throw new Error();

      form.reset();
      showStatus("Thanks! Your data bug is now tracked.");
    } catch (err) {
      console.error(err);
      showStatus("Unable to send the data bug. Please try again.", true);
    }
  });
</script>

  </body>
</html>
