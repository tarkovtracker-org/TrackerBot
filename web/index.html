<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TarkovTracker - Issue Portal</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="page">
      <section class="card">
        <span class="pill">Website issue</span>
        <h1>Report a website issue</h1>
        <p>
          Use this form for tarkovtracker.org app issues.
        </p>
        <div class="actions">
          <button type="button" onclick="location.href='/issue'">Open website issue form</button>
        </div>
      </section>

      <section class="card">
        <span class="pill">Data issue</span>
        <h1>Report a data issue</h1>
        <p>
          Use this form for overlay, item data, progression, or dataset problems.
          Reports route straight to the data repository.
        </p>
        <div class="actions">
          <button type="button" onclick="location.href='/data'">Open data report form</button>
        </div>
      </section>
    </main>
  </body>
</html>
